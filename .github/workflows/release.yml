name: release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: >-
          npm dist-tag. `latest` for stable releases, `next` for prereleases.
          Publishing a stable version under `next` leaves `latest` pointing at an
          older build, which is what consumers get by default.
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public --tag "${{ inputs.dist_tag }}" --provenance
